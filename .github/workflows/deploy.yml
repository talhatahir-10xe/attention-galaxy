name: Deploy to GitHub Pages

# Builds the frontend and publishes it to GitHub Pages on every push to main.
# The large model weights are NOT in the repo (see .gitignore); set a repository
# variable VITE_MODEL_URL to the absolute URL of the .onnx on the Hugging Face
# Hub (Settings → Secrets and variables → Actions → Variables). The build bakes
# that URL in; the browser then fetches the weights from the Hub, not from Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_MODEL_URL: ${{ vars.VITE_MODEL_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
