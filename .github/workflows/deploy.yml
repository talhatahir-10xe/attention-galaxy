name: Deploy to GitHub Pages

# Builds the frontend and publishes it to GitHub Pages on every push to main.
# The model weights are not in the repo (see .gitignore) — the browser fetches
# them at runtime from the Hugging Face Hub, using the URL in src/infer.js. To
# host the weights elsewhere, set a repository variable VITE_MODEL_URL (Settings
# → Secrets and variables → Actions → Variables) and the build uses that instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_MODEL_URL: ${{ vars.VITE_MODEL_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
